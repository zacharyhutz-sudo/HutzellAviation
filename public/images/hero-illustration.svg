<svg width="960" height="760" viewBox="0 0 960 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Stylized aircraft rental illustration</title>
  <desc id="desc">A small airplane climbing over a golden horizon beneath a deep blue sky.</desc>
  <defs>
